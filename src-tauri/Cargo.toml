[package]
name = "engys"
version = "1.3.0"
description = "Desktop GUI for the mihomo proxy core"
authors = ["vulpeace"]
license = "GPL-3.0-only"
repository = "https://github.com/vulpeace/engys"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["time", "sync"] }
which = "8"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
percent-encoding = "2"
flate2 = "1"
tauri-plugin-deep-link = "2.6.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
sha2 = "0.10"
tauri = { version = "2.12.5", features = ["tray-icon"] }
sysinfo = "0.37"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-vpn = { path = "plugins/android-vpn" }
