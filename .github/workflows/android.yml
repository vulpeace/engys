name: Android
on:
  push:
    tags:
      - '**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: ${{ github.event.deleted != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-go@v5
        with:
          go-version-file: core-mobile/go.mod
          cache-dependency-path: core-mobile/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Test native configuration mapping
        working-directory: core-mobile
        run: go test ./mobile
      - name: Build debug APK
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          pnpm android:build --debug --apk --ci
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
