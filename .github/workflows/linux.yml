name: Linux
on:
  push:
    tags:
      - '**'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
permissions:
  contents: read
jobs:
  build:
    if: ${{ github.event.deleted != true }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Install Tauri and AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential file \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libfuse2 patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Build Linux AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
