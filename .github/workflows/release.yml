name: Publish release
on:
  workflow_dispatch:

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Find latest successful tag build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=$(gh run list --workflow build.yml --event push --status success --limit 1 \
            --json databaseId,headBranch,headSha,url \
            --jq '.[] | [.databaseId, .headBranch, .headSha, .url] | @tsv')
          if [[ -z "$build" ]]; then
            echo 'No successful tag-triggered build.yml run was found.' >&2
            exit 1
          fi
          IFS=$'\t' read -r run_id tag commit url <<< "$build"
          echo "Using build $url for tag $tag."
          printf 'run_id=%s\ntag=%s\ncommit=%s\n' "$run_id" "$tag" "$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.build.outputs.run_id }}
          name: linux-appimage
          path: release-assets/linux
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.build.outputs.run_id }}
          name: android-release
          path: release-assets/android
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.build.outputs.run_id }}
          name: windows-x64
          path: release-assets/windows
      - name: Publish AppImage, signed APKs and Windows executable
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.build.outputs.commit }}
        run: |
          shopt -s globstar nullglob
          appimages=(release-assets/linux/**/*.AppImage)
          apks=(release-assets/android/**/*-release.apk)
          windows_exe=release-assets/windows/engys.exe
          if (( ${#appimages[@]} == 0 || ${#apks[@]} == 0 )) || [[ ! -f "$windows_exe" ]]; then
            echo 'Expected an AppImage, a signed release APK, and engys.exe.' >&2
            exit 1
          fi

          git fetch --no-tags --depth=1 origin "refs/tags/$RELEASE_TAG"
          if [[ $(git rev-parse 'FETCH_HEAD^{commit}') != "$RELEASE_COMMIT" ]]; then
            echo 'The release tag no longer points to the commit used by the build.' >&2
            exit 1
          fi

          gh release create --verify-tag --generate-notes -- \
            "$RELEASE_TAG" "${appimages[@]}" "${apks[@]}" "$windows_exe"
